<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} · ReachDog</title>
  <meta name="description" content="ReachDog — AI-Powered Sales Lead CRM for iOS. Privacy Policy and Support.">
  <link rel="icon" type="image/png" href="{{ '/assets/icon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/icon.png' | relative_url }}">
  <style>
    :root {
      --brand: #FA6E22;
      --brand-dark: #E25A10;
      --text: #1C1C1E;
      --muted: #6B6B70;
      --bg: #FFFFFF;
      --surface: #FFF8F3;
      --border: #F0E4DA;
    }
    * { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    header.site {
      background: #FFFFFF;
      color: var(--text);
      padding: 28px 0;
      border-bottom: 1px solid var(--border);
    }
    header.site .wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header.site img.logo {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      display: block;
    }
    header.site a.brand {
      color: var(--brand-dark);
      text-decoration: none;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    header.site .tagline {
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      margin-top: 2px;
    }
    nav.site {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 0;
    }
    nav.site .wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      gap: 24px;
    }
    nav.site a {
      color: var(--brand-dark);
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
    }
    nav.site a:hover { text-decoration: underline; }
    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }
    main h1 {
      color: var(--brand-dark);
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.8px;
      margin: 0 0 8px;
    }
    main h2 {
      color: var(--text);
      font-size: 22px;
      font-weight: 700;
      margin: 36px 0 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    main h3 {
      color: var(--text);
      font-size: 17px;
      font-weight: 700;
      margin: 24px 0 6px;
    }
    main h1 + p { color: var(--muted); font-size: 15px; margin-top: 0; }
    main a {
      color: var(--brand-dark);
      text-decoration: underline;
      text-decoration-color: rgba(250, 110, 34, 0.4);
      text-underline-offset: 2px;
    }
    main a:hover { text-decoration-color: var(--brand); }
    main strong { color: var(--text); }
    main code {
      background: var(--surface);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.9em;
      color: var(--brand-dark);
    }
    main ul, main ol { padding-left: 22px; }
    main li { margin: 4px 0; }
    main table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      font-size: 14px;
    }
    main table th, main table td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    main table th {
      background: var(--surface);
      color: var(--brand-dark);
      font-weight: 700;
    }
    main hr {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 32px 0;
    }
    main blockquote {
      border-left: 3px solid var(--brand);
      margin: 16px 0;
      padding: 4px 16px;
      background: var(--surface);
      color: var(--muted);
      border-radius: 0 6px 6px 0;
    }
    footer.site {
      border-top: 1px solid var(--border);
      padding: 24px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
    footer.site a { color: var(--brand-dark); text-decoration: none; }
    footer.site a:hover { text-decoration: underline; }
    @media (max-width: 520px) {
      header.site a.brand { font-size: 22px; }
      header.site img.logo { width: 44px; height: 44px; }
      main h1 { font-size: 30px; }
      main { padding: 32px 20px 60px; }
    }
  </style>
</head>
<body>

<header class="site">
  <div class="wrap">
    <img class="logo" src="{{ '/assets/icon.png' | relative_url }}" alt="ReachDog">
    <div>
      <a class="brand" href="{{ '/' | relative_url }}">ReachDog</a>
      <div class="tagline">AI-Powered Sales Lead CRM for iOS</div>
    </div>
  </div>
</header>

<nav class="site">
  <div class="wrap">
    <a href="#privacy-policy">Privacy Policy</a>
    <a href="#support">Support</a>
    <a href="#contact">Contact</a>
  </div>
</nav>

<main>
  {{ content }}
</main>

<footer class="site">
  © 2026 ReachDog · <a href="mailto:layth@Motionpexels.com">layth@Motionpexels.com</a>
</footer>

</body>
</html>
